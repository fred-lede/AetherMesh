<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — AetherMesh</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #07111a;
      --panel: rgba(11, 24, 38, 0.88);
      --panel-2: rgba(17, 34, 52, 0.95);
      --line: rgba(150, 210, 255, 0.18);
      --text: #e8f3fb;
      --muted: #9fb6c8;
      --accent: #5eead4;
      --accent-2: #60a5fa;
      --warn: #f59e0b;
      --bad: #f87171;
      --good: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.28), transparent 35%),
        radial-gradient(circle at top right, rgba(94, 234, 212, 0.18), transparent 32%),
        linear-gradient(180deg, #04070b 0%, #07111a 35%, #03060a 100%);
      min-height: 100vh;
    }
    .shell { max-width: 860px; margin: 0 auto; padding: 24px; }

    /* Nav */
    .nav {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 0 16px;
      border-bottom: 1px solid var(--line);
    }
    .nav a {
      padding: 7px 16px;
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav a:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav a.active { background: rgba(94, 234, 212, 0.1); color: var(--accent); }
    .nav .spacer { flex: 1; }
    .nav .logout { color: var(--bad); }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 18px;
    }
    .card h2 { margin: 0 0 16px; font-size: 1.05rem; letter-spacing: 0.02em; }

    .stat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.85rem; }
    .stat-row .label { color: var(--muted); }
    .stat-row .value { font-weight: 500; }

    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
    }
    .pill.ok { background: rgba(52, 211, 153, 0.14); color: var(--good); }
    .pill.warn { background: rgba(245, 158, 11, 0.16); color: var(--warn); }
    .pill.disabled { background: rgba(248, 113, 113, 0.14); color: var(--bad); }
    .pill.bad { background: rgba(248, 113, 113, 0.14); color: var(--bad); }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 16px;
      color: #03110f;
      background: var(--accent);
      font: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-sm { padding: 5px 12px; font-size: 0.78rem; }
    .btn-danger { background: var(--bad); color: #fff; }

    hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    .table th, .table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    .table th {
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .table td { vertical-align: middle; }
    .table code {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.82rem;
    }

    #operation-status {
      display: none;
      margin-bottom: 14px;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
    }
    .status- { background: rgba(94, 234, 212, 0.1); color: var(--accent); }
    .status-ok { background: rgba(52, 211, 153, 0.12); color: var(--good); }
    .status-warn { background: rgba(245, 158, 11, 0.14); color: var(--warn); }
    .status-bad { background: rgba(248, 113, 113, 0.14); color: var(--bad); }

    .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 0.82rem; letter-spacing: 0.02em; }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <a href="/">Dashboard</a>
      {% if user_role == 'admin' %}
      <a href="/admin/api-keys">API Keys</a>
      <a href="/admin/users">Users</a>
      {% endif %}
      <a href="/profile" class="active">Profile</a>
      <span class="spacer"></span>
      <a href="/logout" class="logout">Logout</a>
    </nav>

    <div id="operation-status"></div>

    <div class="card">
      <h2>Account</h2>
      <div id="profile-panel"><span class="mono" style="color:var(--muted)">Loading...</span></div>
    </div>

    <div class="card">
      <h2>Change Password</h2>
      <button class="btn btn-sm change-pwd-btn">Change Password</button>
    </div>

    <div class="card">
      <h2>My API Keys</h2>
      <button class="btn btn-sm toggle-keys-btn">Manage My API Keys</button>
      <div id="my-api-keys-panel" style="margin-top:12px;display:none"></div>
    </div>
  </div>

  <script src="/static/shared.js"></script>
  <script src="/static/profile.js"></script>
</body>
</html>
